{% extends 'dashboard/admin/base_admin.html' %}

{% block title %}Yangi E'lon - BILOL Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">Yangi E'lon</h3>
            <a href="{% url 'dashboard:admin_announcements' %}" class="btn btn-outline-secondary">Orqaga</a>
        </div>

        <div class="card card-custom border-0 shadow">
            <div class="card-body p-4 p-md-5">
                <div class="alert alert-info mb-4">
                    <i class="fas fa-info-circle me-2"></i> Bu yerda yaratilgan e'lon barcha foydalanuvchilarning bildirishnomalar paneliga yuboriladi.
                </div>

                <form method="post" action="{% url 'dashboard:admin_create_announcement' %}">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="title" class="form-label fw-bold">E'lon sarlavhasi <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg" id="title" name="title" required placeholder="Masalan: Yangi kurs qo'shildi!">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold d-block">Muhimlik darajasi <span class="text-danger">*</span></label>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check flex-grow-1 border rounded p-3">
                                <input class="form-check-input ms-2" type="radio" name="priority" id="priorityLow" value="low">
                                <label class="form-check-label ms-2 text-info fw-bold d-block" for="priorityLow">
                                    <i class="fas fa-circle me-1"></i> Past
                                </label>
                            </div>
                            <div class="form-check flex-grow-1 border rounded p-3 border-primary">
                                <input class="form-check-input ms-2" type="radio" name="priority" id="priorityMedium" value="medium" checked>
                                <label class="form-check-label ms-2 text-warning fw-bold d-block" for="priorityMedium">
                                    <i class="fas fa-circle me-1"></i> O'rtacha
                                </label>
                            </div>
                            <div class="form-check flex-grow-1 border rounded p-3">
                                <input class="form-check-input ms-2" type="radio" name="priority" id="priorityHigh" value="high">
                                <label class="form-check-label ms-2 text-danger fw-bold d-block" for="priorityHigh">
                                    <i class="fas fa-circle me-1"></i> Yuqori
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="content" class="form-label fw-bold">E'lon matni <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="content" name="content" rows="6" required placeholder="Foydalanuvchilarga yetkazmoqchi bo'lgan xabaringizni yozing..."></textarea>
                    </div>

                    <div class="mt-5">
                        <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold">
                            <i class="fas fa-paper-plane me-2"></i> Hammaga yuborish
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Simple highlighting for selected priority
        const radios = document.querySelectorAll('input[name="priority"]');
        radios.forEach(radio => {
            radio.addEventListener('change', function() {
                document.querySelectorAll('.form-check.border-primary').forEach(el => {
                    el.classList.remove('border-primary');
                });
                if(this.checked) {
                    this.closest('.form-check').classList.add('border-primary');
                }
            });
        });
    });
</script>
{% endblock %}
